{% extends 'base.html' %}

{% block body %}
<div class="container">
    <h1>Eliminar Persona</h1>
    <p>¿Estás seguro de que deseas eliminar a {{ object }}?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Eliminar</button>
        <a href="{% url 'persona_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
{% endblock %}
