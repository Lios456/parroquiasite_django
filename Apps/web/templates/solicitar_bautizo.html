{% extends 'base.html' %}

{% block body %}
<style>
    body {
        background-color: #f8f9fa;
    }

    .form-container {
        max-width: 500px;
        margin: 50px auto;
        padding: 30px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
</style>
<div class="container">
    <div class="form-container">
        <h3 class="text-center">Solicitar Bautizo</h3>
        <form id="bautizoForm" method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="fecha" class="form-label">Fecha tentativa</label>
                <input type="date" class="form-control" id="fecha" name="fecha" min="{{ current_date }}" required>
            </div>
            <div class="mb-3">
                <label for="nombre_nino" class="form-label">Nombre del Niño/Niños</label>
                <input type="text" class="form-control" id="nombre_nino" name="nombre_nino" required>
            </div>
            <div class="mb-3">
                <label for="nombre_padre" class="form-label">Nombre del Padre</label>
                <input type="text" class="form-control" id="nombre_padre" name="nombre_padre" required>
            </div>
            <div class="mb-3">
                <label for="nombre_madre" class="form-label">Nombre de la Madre</label>
                <input type="text" class="form-control" id="nombre_madre" name="nombre_madre" required>
            </div>
            <div class="mb-3">
                <label for="padrinos" class="form-label">Padrinos</label>
                <input type="text" class="form-control" id="padrinos" name="padrinos" required>
            </div>
            <div class="mb-3">
                <label for="observaciones" class="form-label">Observaciones</label>
                <textarea class="form-control" id="observaciones" name="observaciones" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Enviar Solicitud</button>
        </form>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.3/jquery.validate.min.js"></script>

<script>
    $.validator.addMethod("timeRange", function (value, element) {
        const [inputHours, inputMinutes] = value.split(':').map(Number);
        const minTime = 6 * 60;   // 6:00 AM en minutos
        const maxTime = 21 * 60;  // 9:00 PM en minutos
        const totalMinutes = inputHours * 60 + inputMinutes;

        return totalMinutes >= minTime && totalMinutes <= maxTime;
    });

    $.validator.addMethod("dateAhead", function (value, element) {
        const inputDate = new Date(value);
        const currentDate = new Date();
        const minDate = new Date(currentDate.setDate(currentDate.getDate() + 7));

        return inputDate >= minDate;
    });

    $(document).ready(function () {
        $("#bautizoForm").validate({
            rules: {
                fecha: {
                    required: true,
                    date: true,
                    dateAhead: true
                },
                hora: {
                    required: true,
                    timeRange: true
                },
                nombre_nino: {
                    required: true,
                    minlength: 2
                },
                nombre_padre: {
                    required: true,
                    minlength: 2
                },
                nombre_madre: {
                    required: true,
                    minlength: 2
                },
                padrinos: {
                    required: true,
                    minlength: 2
                }
            },
            messages: {
                fecha: {
                    required: "Por favor, ingresa la fecha.",
                    dateAhead: "La fecha debe tener al menos una semana de anticipación."
                },
                hora: {
                    required: "Por favor, ingresa la hora.",
                    timeRange: "El horario debe ser entre 6:00 AM y 9:00 PM"
                },
                nombre_nino: {
                    required: "Por favor, ingresa el nombre del niño/niños.",
                    minlength: "Mínimo 2 caracteres"
                },
                nombre_padre: {
                    required: "Por favor, ingresa el nombre del padre.",
                    minlength: "Mínimo 2 caracteres"
                },
                nombre_madre: {
                    required: "Por favor, ingresa el nombre de la madre.",
                    minlength: "Mínimo 2 caracteres"
                },
                padrinos: {
                    required: "Por favor, ingresa el nombre de los padrinos.",
                    minlength: "Mínimo 2 caracteres"
                }
            },
            errorElement: "div",
            errorClass: "invalid-feedback",
            validClass: "is-valid",
            errorPlacement: function (error, element) {
                error.addClass("invalid-feedback");
                element.closest('.mb-3').append(error);
            },
            highlight: function (element) {
                $(element).addClass('is-invalid').removeClass('is-valid');
            },
            unhighlight: function (element) {
                $(element).removeClass('is-invalid').addClass('is-valid');
            }
        });
    });
</script>

{% endblock %}
