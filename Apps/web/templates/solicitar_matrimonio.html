{% extends 'base.html' %}

{% block body %}
<style>
    body {
        background-color: #f8f9fa;
    }

    .form-container {
        max-width: 500px;
        margin: 50px auto;
        padding: 30px;
        background: white;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
</style>
<div class="container">
    <div class="form-container">
        <h3 class="text-center">Solicitar Matrimonio</h3>
        <form id="matrimonioForm" method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="fecha" class="form-label">Fecha tentativa</label>
                <input type="date" class="form-control" id="fecha" name="fecha" min="{{ current_date }}" required>
            </div>
            <div class="mb-3">
                <label for="nombre_novio" class="form-label">Nombre del Novio</label>
                <input type="text" class="form-control" id="nombre_novio" name="nombre_novio" required>
            </div>
            <div class="mb-3">
                <label for="nombre_novia" class="form-label">Nombre de la Novia</label>
                <input type="text" class="form-control" id="nombre_novia" name="nombre_novia" required>
            </div>
            <div class="mb-3">
                <label for="padrinos" class="form-label">Padrinos</label>
                <input type="text" class="form-control" id="padrinos" name="padrinos" required>
            </div>
            <div class="mb-3">
                <label for="observaciones" class="form-label">Observaciones</label>
                <textarea class="form-control" id="observaciones" name="observaciones" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Enviar Solicitud</button>
        </form>
    </div>
</div>




{% endblock %}
